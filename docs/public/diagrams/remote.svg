<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="-apple-system, 'Segoe UI', Ubuntu, Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Agentless remote monitoring</title>
  <desc id="d">Bulwark on your computer connects to each machine over your existing SSH with a pinned host key and a restricted key. On a Linux server it copies itself in, scans and removes itself; on a Mac or a Windows PC it runs the installed Bulwark; WSL is reached through the Windows host. Results come back into a separate database per machine, and alerts go to Telegram or e-mail.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fafc"/><stop offset="1" stop-color="#eef3f8"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#19b3a3"/><stop offset="1" stop-color="#0b7f86"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffab3d"/><stop offset="1" stop-color="#ef6c1a"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3f8ef0"/><stop offset="1" stop-color="#1d5fc2"/></linearGradient>
    <linearGradient id="slate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4b5565"/><stop offset="1" stop-color="#262c36"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2468f"/><stop offset="1" stop-color="#c2185b"/></linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#19b3a3"/><stop offset="1" stop-color="#3f8ef0"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b2a3a" flood-opacity="0.12"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#5b6b7d"/></marker>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#dfe7ef" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="470" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="470" rx="18" fill="url(#grid)" opacity="0.6"/>

  <text x="32" y="48" font-size="24" font-weight="700" fill="#16202c">Watch your other machines — no agent, no server, no open port</text>
  <text x="32" y="72" font-size="14" fill="#5b6b7d">Bulwark signs in over the SSH you already use, checks, brings the results home and leaves</text>

  <!-- your computer -->
  <g transform="translate(32 104)" filter="url(#sh)">
    <rect width="250" height="236" rx="14" fill="#fff" stroke="#a9dcd6" stroke-width="1.5"/>
    <path d="M0 38V14A14 14 0 0 1 14 0H236A14 14 0 0 1 250 14V38Z" fill="url(#teal)"/>
    <text x="16" y="25" font-size="13" font-weight="700" fill="#fff" letter-spacing=".3">YOUR COMPUTER</text>
    <rect x="16" y="54" width="44" height="44" rx="11" fill="url(#teal)"/>
    <path d="M38 61l11 4.5v8c0 6.5-4.4 10.6-11 13-6.6-2.4-11-6.5-11-13v-8z" fill="none" stroke="#fff" stroke-width="2.2"/>
    <text x="72" y="74" font-size="15" font-weight="700" fill="#16202c">Bulwark</text>
    <text x="72" y="92" font-size="12" fill="#5b6b7d">app, or bulwarkctl hosts</text>
    <g font-size="12" fill="#33414f">
      <text x="16" y="126">• schedules each machine</text>
      <text x="16" y="146">• one database per machine</text>
      <text x="16" y="166">• ignores kept per machine</text>
      <text x="16" y="186">• unreachable ≠ clean, ever</text>
    </g>
    <rect x="16" y="200" width="218" height="24" rx="12" fill="#e7f7f5"/>
    <text x="125" y="216" font-size="11.5" fill="#0b7f86" text-anchor="middle" font-weight="600">findings stay on this computer</text>
  </g>

  <!-- the wire -->
  <g transform="translate(300 150)">
    <rect width="250" height="144" rx="14" fill="#fff" stroke="#d5dee8" filter="url(#sh)"/>
    <text x="16" y="28" font-size="14" font-weight="700" fill="#16202c">Your SSH, hardened</text>
    <g font-size="12" fill="#33414f">
      <circle cx="21" cy="50" r="4" fill="#19b3a3"/><text x="32" y="54">restricted key, set up once</text>
      <circle cx="21" cy="72" r="4" fill="#3f8ef0"/><text x="32" y="76">host keys pinned, never auto-accepted</text>
      <circle cx="21" cy="94" r="4" fill="#8f6bff"/><text x="32" y="98">jump hosts, ~/.ssh/config aliases</text>
      <circle cx="21" cy="116" r="4" fill="#ffab3d"/><text x="32" y="120">batch mode, timeouts, backoff</text>
    </g>
  </g>
  <path d="M282 222h18" stroke="#5b6b7d" stroke-width="2"/>
  <path d="M550 222c40 0 40 -90 90 -90" fill="none" stroke="url(#wire)" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M550 222c40 0 40 -24 90 -24" fill="none" stroke="url(#wire)" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M550 222c40 0 40 42 90 42" fill="none" stroke="url(#wire)" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M550 222c40 0 40 108 90 108" fill="none" stroke="url(#wire)" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- targets -->
  <g font-size="12">
    <g transform="translate(646 104)" filter="url(#sh)">
      <rect width="522" height="56" rx="12" fill="#fff" stroke="#f1dcc6"/>
      <rect x="12" y="10" width="36" height="36" rx="9" fill="url(#orange)"/>
      <circle cx="30" cy="28" r="8.5" fill="none" stroke="#fff" stroke-width="2.2"/><circle cx="30" cy="17.5" r="2.8" fill="#fff"/><circle cx="21" cy="33" r="2.8" fill="#fff"/><circle cx="39" cy="33" r="2.8" fill="#fff"/>
      <text x="60" y="25" font-size="14" font-weight="700" fill="#16202c">Linux server</text>
      <text x="60" y="43" fill="#5b6b7d">copies its scanner in, scans, removes it — or uses an installed one</text>
    </g>
    <g transform="translate(646 170)" filter="url(#sh)">
      <rect width="522" height="56" rx="12" fill="#fff" stroke="#d9dee5"/>
      <rect x="12" y="10" width="36" height="36" rx="9" fill="url(#slate)"/>
      <text x="30" y="34" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">⌘</text>
      <text x="60" y="25" font-size="14" font-weight="700" fill="#16202c">Mac</text>
      <text x="60" y="43" fill="#5b6b7d">runs the installed Bulwark — FileVault, Gatekeeper, SIP, firewall, updates, keys</text>
    </g>
    <g transform="translate(646 236)" filter="url(#sh)">
      <rect width="522" height="56" rx="12" fill="#fff" stroke="#cfdcef"/>
      <rect x="12" y="10" width="36" height="36" rx="9" fill="url(#blue)"/>
      <rect x="20" y="18" width="9" height="9" fill="#fff"/><rect x="31" y="18" width="9" height="9" fill="#fff"/><rect x="20" y="29" width="9" height="9" fill="#fff"/><rect x="31" y="29" width="9" height="9" fill="#fff"/>
      <text x="60" y="25" font-size="14" font-weight="700" fill="#16202c">Windows PC</text>
      <text x="60" y="43" fill="#5b6b7d">through PowerShell — Defender, firewall, BitLocker, UAC, RDP, SMBv1, updates</text>
    </g>
    <g transform="translate(646 302)" filter="url(#sh)">
      <rect width="522" height="56" rx="12" fill="#fff" stroke="#cfdcef"/>
      <rect x="12" y="10" width="36" height="36" rx="9" fill="url(#blue)"/>
      <rect x="19" y="17" width="7" height="7" fill="#fff" opacity=".6"/><rect x="28" y="17" width="7" height="7" fill="#fff" opacity=".6"/><rect x="19" y="26" width="7" height="7" fill="#fff" opacity=".6"/>
      <rect x="27" y="25" width="15" height="13" rx="2" fill="#0b1520"/><path d="M30 29l3 2.5-3 2.5" fill="none" stroke="#ffb547" stroke-width="1.6" stroke-linecap="round"/>
      <text x="60" y="25" font-size="14" font-weight="700" fill="#16202c">WSL</text>
      <text x="60" y="43" fill="#5b6b7d">the Linux checks, minus what the Windows host owns — via the PC as a jump host</text>
    </g>
  </g>

  <!-- results back -->
  <path d="M907 360V392H470C380 392 380 316 286 316" fill="none" stroke="#5b6b7d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/>
  <rect x="470" y="380" width="170" height="24" rx="12" fill="#fff" stroke="#d5dee8"/>
  <text x="555" y="396" font-size="11.5" fill="#33414f" text-anchor="middle">results as JSON, over SSH</text>
  <path d="M157 340v16" stroke="#c2185b" stroke-width="2" marker-end="url(#ar)"/>

  <g transform="translate(32 360)" filter="url(#sh)">
    <rect width="250" height="84" rx="14" fill="#fff" stroke="#f0cddb"/>
    <circle cx="34" cy="42" r="16" fill="#29a9eb"/>
    <path d="M25 42l17-7-3.5 15-4.5-4.5-3.5 2.4.1-4.6 7-5.8-9 4.5z" fill="#fff"/>
    <rect x="58" y="31" width="30" height="22" rx="4" fill="url(#orange)"/><path d="M60 34l13 9 13-9" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="100" y="38" font-size="13" font-weight="700" fill="#16202c">Alerts</text>
    <text x="100" y="56" font-size="11" fill="#5b6b7d">new issues · went quiet ·</text>
    <text x="100" y="71" font-size="11" fill="#5b6b7d">identity changed · daily</text>
  </g>
</svg>
