<!--
  The desktop app icon (Linux dock, app grid, window list, tray), drawn in the Ubuntu/Yaru idiom
  rather than as a full-bleed tile: the shield itself is the silhouette, sized optically to sit
  with the system's own icons, with a top highlight, a defining rim and a soft drop shadow.
  `icon.svg` (aqua shield on a graphite tile) stays the brand mark used by the README and docs.
  Every PNG the bundles ship is rendered from this file by scripts/render-app-icons.py.
-->
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#7fe6dc"/>
      <stop offset="0.5" stop-color="#25a9a5"/>
      <stop offset="1" stop-color="#1f6f8e"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="0.43" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dy="7" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.38"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="shield" d="M12 8 H28 V19 H40 V8 H60 V19 H72 V8 H88 V48 C88 70 72 86 50 94 C28 86 12 70 12 48 Z"/>
  </defs>
  <g filter="url(#shadow)">
    <g transform="translate(26 6) scale(4.6)">
      <use href="#shield" fill="url(#body)" stroke="#16596b" stroke-width="2.2" stroke-linejoin="round"/>
      <use href="#shield" fill="url(#shine)"/>
      <path d="M32 53 L45 66 L69 40" fill="none" stroke="#ffffff" stroke-width="9.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
