id: BLWK-NET-003
title: A database or development service is open to the network
category: network-egress
severity: high
collector: listening_ports
# Only an all-interfaces bind fires. A loopback bind is local-only, and a bind to one specific
# address (a VPN or tailnet interface, for example) is a deliberate choice this rule leaves alone.
condition: listen_address in ["0.0.0.0", "::"] and port in [1025, 2375, 3306, 5432, 5672, 6379, 8025, 9000, 9001, 9200, 10050, 10051, 11211, 15672, 27017]
explain: >
  A database or development service is reachable from your network on port {{ listening_ports.port }}
  (listening on {{ listening_ports.listen_address }}). On home, office or café Wi-Fi, anyone nearby can
  connect to it, and development services often run without a password. Docker opens ports to the
  whole network by default.
fix: |
  Make the service reachable from this computer only.
  1. For Docker Compose, change the port line from '{{ listening_ports.port }}:{{ listening_ports.port }}' to '127.0.0.1:{{ listening_ports.port }}:{{ listening_ports.port }}' and restart the stack.
  2. For a service installed directly, set its listen or bind address to 127.0.0.1 in its config file.
  3. Need it from another machine? Use an SSH tunnel ('ssh -L {{ listening_ports.port }}:localhost:{{ listening_ports.port }} you@this-machine') or a private network such as Tailscale or WireGuard.
references: [ATTACK-T1133, ATTACK-T1210]
