id: BLWK-SSH-002
title: SSH root login is permitted
category: ssh-remote-access
severity: high
collector: sshd_config
condition: permit_root_login == "yes"
explain: >
  PermitRootLogin is "{{ sshd.permit_root_login }}" (from {{ sshd.permit_root_login_from }}), allowing direct root logins
  over SSH. A compromised root password or key is a single step from full system control.
fix: "Put 'PermitRootLogin no' in /etc/ssh/sshd_config.d/00-hardening.conf and reload the SSH service ('sudo sshd -t' checks it first). sshd keeps the first value it reads and reads that folder first; if sshd_config has no Include line for it, put the line at the top of /etc/ssh/sshd_config. Do not edit files under /usr/etc: updates replace them. Use 'prohibit-password' instead of 'no' if key-based root access is required."
references: [CIS-5.2.8, ATTACK-T1078]
