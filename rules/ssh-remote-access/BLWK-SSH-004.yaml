id: BLWK-SSH-004
title: SSH X11 forwarding is enabled
category: ssh-remote-access
severity: low
collector: sshd_config
condition: x11_forwarding == "yes"
explain: >
  X11Forwarding is "{{ sshd.x11_forwarding }}" (from {{ sshd.x11_forwarding_from }}). X11 forwarding
  exposes any local X server to whatever runs on the remote end of the session, and has a
  history of X11-protocol-level compromise (keystroke injection, screen capture).
fix: "Put 'X11Forwarding no' in /etc/ssh/sshd_config.d/00-hardening.conf and reload the SSH service ('sudo sshd -t' checks it first). sshd keeps the first value it reads and reads that folder first; if sshd_config has no Include line for it, put the line at the top of /etc/ssh/sshd_config. Do not edit files under /usr/etc: updates replace them. Leave it on only if remote GUI apps are a deliberate requirement."
references: [CIS-5.2.4]
