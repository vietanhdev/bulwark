id: BLWK-SSH-010
title: SSH agent forwarding is enabled
category: ssh-remote-access
severity: low
collector: sshd_config
condition: allow_agent_forwarding == "yes"
explain: >
  AllowAgentForwarding is "{{ sshd.allow_agent_forwarding }}" (from
  {{ sshd.allow_agent_forwarding_from }}). Agent
  forwarding lets anyone with root (or the forwarding user's privileges) on this host make
  use of the connecting client's SSH agent to authenticate onward as that client, without
  ever seeing the private key itself — a well-known lateral-movement technique on
  multi-hop SSH setups.
fix: "Put 'AllowAgentForwarding no' in /etc/ssh/sshd_config.d/00-hardening.conf and reload the SSH service ('sudo sshd -t' checks it first). sshd keeps the first value it reads and reads that folder first; if sshd_config has no Include line for it, put the line at the top of /etc/ssh/sshd_config. Do not edit files under /usr/etc: updates replace them. Leave it on only if agent forwarding is a deliberate requirement."
references: [ATTACK-T1563]
