id: BLWK-SSH-005
title: SSH TCP forwarding/tunneling is enabled
category: ssh-remote-access
# Low, not medium: "yes" is what OpenSSH ships with, so this fires on every stock server. It
# widens what a logged-in user can do; it does not let anyone in. Rated with the other
# forwarding defaults (X11, agent). GatewayPorts and tun devices, which are off by default and
# expose more, stay medium.
severity: low
collector: sshd_config
# Every value sshd accepts except "no" (sshd_config(5), AllowTcpForwarding). Matching only "yes"
# missed the rest:
#   all    - the same as yes; `sshd -T` prints it as yes.
#   local  - a client can still open tunnels from this host into whatever it can reach (ssh -L),
#            which is the pivot the rule is about.
#   remote - a client can still open listening ports on this host that lead back to it (ssh -R).
# The last two are narrower than yes, so the text names the value instead of saying "on".
condition: allow_tcp_forwarding in ["yes", "all", "local", "remote"]
explain: >
  AllowTcpForwarding is set to "{{ sshd.allow_tcp_forwarding }}" in sshd_config ("yes" and
  "all" allow both directions, "local" and "remote" one each). TCP forwarding lets any SSH
  user open port tunnels through this host — the exact mechanism used to pivot into internal
  networks or to reach services (like VNC) that are only supposed to be reachable from
  localhost.
fix: "Set 'AllowTcpForwarding no' in /etc/ssh/sshd_config, or restrict it per-user with a Match block, unless tunneling is a deliberate requirement."
references: [CIS-5.2.5, ATTACK-T1572]
