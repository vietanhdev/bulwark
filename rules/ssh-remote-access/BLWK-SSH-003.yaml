id: BLWK-SSH-003
title: SSH allows empty passwords
category: ssh-remote-access
severity: critical
collector: sshd_config
condition: permit_empty_passwords == "yes"
explain: >
  PermitEmptyPasswords is "{{ sshd.permit_empty_passwords }}" (from
  {{ sshd.permit_empty_passwords_from }}) — any account with a
  blank password can log in over SSH with no credential at all.
fix: "Put 'PermitEmptyPasswords no' in /etc/ssh/sshd_config.d/00-hardening.conf and reload the SSH service ('sudo sshd -t' checks it first). sshd keeps the first value it reads and reads that folder first; if sshd_config has no Include line for it, put the line at the top of /etc/ssh/sshd_config. Do not edit files under /usr/etc: updates replace them."
references: [CIS-5.2.11]
