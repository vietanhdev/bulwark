id: BLWK-SSH-012
title: SSH private key is not passphrase-protected
category: ssh-remote-access
severity: high
collector: ssh_private_keys
# Require encryption_known so this fires only on a key we positively read as plaintext, never on one
# whose header we couldn't parse — that undetermined case is BLWK-SSH-013, not a confident "plaintext".
condition: encrypted == false and encryption_known == true
explain: >
  Your SSH key {{ ssh_private_keys.path }} has no passphrase. It works like a password that is written
  down: anyone or any program that copies this one file can log in to every server and Git host that
  trusts it, with nothing else needed.
fix: |
  Lock the key with a passphrase. It takes a minute and your servers need no changes.
  1. In the Bulwark app, open this issue and use "Add a passphrase". In a terminal, run 'ssh-keygen -p -f {{ ssh_private_keys.path }}'.
  2. To avoid typing it all the time, load the key once per session with 'ssh-add {{ ssh_private_keys.path }}'.
  3. Delete keys for machines you no longer use.
  Stronger options: keep keys in a password manager's SSH agent (Bitwarden, 1Password, KeePassXC), or use a hardware key that cannot be copied at all ('ssh-keygen -t ed25519-sk' with a YubiKey).
references: [CIS-5.2, ATTACK-T1552.004, ATTACK-T1078]
