id: BLWK-BANN-001
title: "No custom legal warning banner is set (/etc/{{ banners.file }})"
category: logging-auditing
severity: info
collector: banners
# The Windows host owns this inside WSL (its kernel, network stack and console), so it is not
# something the distro can act on: reported as not applicable there, never as passing.
skip_on: [wsl]
profiles: [server]
# Fires for any banner without a warning: the distribution's default text, an empty file, or text
# someone wrote that does not say access is restricted. `banners.found` says which. Only the
# first is replaced by `fix banner` (fact `is_default`); the other two are somebody's choice.
condition: has_warning == false
explain: >
  /etc/{{ banners.file }} {{ banners.found }}, so it does not warn that access is restricted.
  In some jurisdictions, a clear "unauthorized access is prohibited" banner is what establishes
  that someone connecting without authorization was actually warned. The distribution's default
  banner does not do that, and it also tells anyone who connects the exact OS version.
  Scoped to the server profile: a login banner's function is legal, not technical — it
  establishes that access was unauthorized, which matters for a multi-user remote system.
  On a personal desktop it protects nothing, and /etc/issue.net is read only by sshd, so on
  a host that doesn't run sshd it is inert text in a file nobody opens.

fix: "Replace the contents of /etc/issue (local login) and /etc/issue.net (remote login) with a warning banner, not OS version info. 'sudo bulwarkctl fix banner --apply' does this for a file that still holds the distribution's default text; a banner you wrote yourself, or an emptied file, is never overwritten, so edit that one by hand."
references: [CIS-1.7.1]
