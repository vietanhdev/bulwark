id: BLWK-LOG-001
title: auditd is not installed
category: logging-auditing
# Low: no mainstream distribution installs auditd by default, and its absence is a missing
# record, not a way in. A stock server should not open with this as a problem to fix.
severity: low
collector: logging
# The Windows host owns this inside WSL (its kernel, network stack and console), so it is not
# something the distro can act on: reported as not applicable there, never as passing.
skip_on: [wsl]
profiles: [server]
condition: auditd_present == false
explain: >
  No auditd binary was found. Without it, there's no kernel-level record of privileged
  syscalls (file access, exec, permission changes) — the trail that makes a break-in
  reviewable after the fact instead of just a guess.
fix: "Install auditd (e.g. 'apt install auditd') and enable it with 'systemctl enable --now auditd'."
references: [CIS-4.1]
