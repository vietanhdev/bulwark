# Files that hold *detection data*, not secrets. Both are vendored from gitleaks
# (https://github.com/gitleaks/gitleaks) and kept byte-for-byte re-syncable with upstream:
#
# - secret_rules.toml — gitleaks' rule pack. Its allowlists list publicly documented
#   sample keys (e.g. Google's example API keys) precisely so they are NOT reported;
#   GitHub's scanner matches them as if they were live keys.
# - gitleaks_false_positives.toml — the strings gitleaks' own tests use to prove a rule
#   does not fire on look-alikes.
#
# Real secrets anywhere else in the repo are still reported.
paths-ignore:
  - "crates/bulwark-core/src/ai_scan/secret_rules.toml"
  - "crates/bulwark-core/tests/data/gitleaks_false_positives.toml"
