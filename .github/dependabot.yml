version: 2
# One grouped pull request per ecosystem per month, instead of one per dependency per week. The
# maintainer reviews and folds these into a release; CI runs on them only when the owner triggers
# it (CONTRIBUTING.md § CI access). Security updates are a separate repository setting and still
# arrive as soon as an advisory is published.
updates:
  # Keeps the SHA-pinned GitHub Actions current: Dependabot bumps the pinned commit (and its
  # trailing version comment) when the upstream action releases, so pinning doesn't mean going
  # stale. This is the maintenance half of "pin third-party actions to a commit SHA".
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/apps/bulwark-app"
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # typescript-eslint pins its TypeScript peer below the next major (8.x accepts <6.1), so a
      # TypeScript major bump produces a lockfile `npm ci` cannot install. Take majors by hand once
      # typescript-eslint supports them.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # The docs site (VitePress). Never shipped in a package, but it is what bulwark.nrl.ai is built
  # from, so its advisories still matter.
  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: monthly
    groups:
      docs:
        patterns: ["*"]
    ignore:
      # vitepress-plugin-mermaid accepts mermaid 10 || 11 as a peer, so a mermaid major bump makes
      # `npm ci` fail with ERESOLVE. Take majors by hand once the plugin supports them.
      - dependency-name: mermaid
        update-types: ["version-update:semver-major"]
