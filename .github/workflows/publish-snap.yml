name: Publish Snap (GUI)

# Manual only (workflow_dispatch). Every run builds the snap, install-tests it, launches
# its GUI, and then uploads it to the store; there is no build-only mode here. ci.yml's
# snap-build job is the one that builds and tests without uploading, on every push.
#
# Required repository secret (publish only):
#   SNAPCRAFT_STORE_CREDENTIALS — output of `snapcraft export-login`, for an
#                                 account with upload rights to the 'bulwark' snap.
#
# Classic confinement: the store rejects a classic snap on EVERY channel (edge
# included) until the registered name is granted classic confinement via a
# Store-requests forum post (forum.snapcraft.io/c/store-requests/classic-confinement/26). Register the
# name first (`snapcraft register bulwark`), then request classic, then publish.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Snap Store channel to release to"
        type: choice
        options: [edge, beta, candidate, stable]
        default: edge

permissions:
  contents: read

# Only the owner may start jobs; triggering_actor also covers owner-initiated reruns.
jobs:
  publish-snap:
    if: github.triggering_actor == 'vietanhdev'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Builds snap/snapcraft.yaml with LXD inside the runner.
      # The same script ci.yml's snap-build uses (see its header for why not snapcore/action-build).
      - name: Build snap
        id: build
        run: scripts/build-snap-ci.sh

      - name: Upload snap artifact
        uses: actions/upload-artifact@v7
        with:
          name: bulwark-snap
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error

      - name: Install snap + smoke-test
        run: |
          set -euo pipefail
          sudo snap install --dangerous --classic "${{ steps.build.outputs.snap }}"
          # The bundled CLI must run on its own and list its rule pack.
          bulwark.cli --version
          n=$(bulwark.cli rules list | grep -c '^BLWK-' || true)
          echo "rules visible from the snap: $n"
          test "$n" -gt 0
          # Functional: a real scan produces valid JSON with rules loaded; fix previews.
          # `scan` exits non-zero when it finds issues (linter-style), so capture
          # to a file and validate the JSON separately from the exit code.
          bulwark.cli scan --json > "$RUNNER_TEMP/scan.json" || true
          python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));assert d["rules_loaded"]>0,d;print("scan OK: rules_loaded",d["rules_loaded"],"findings",len(d.get("findings",[])))' "$RUNNER_TEMP/scan.json"
          bulwark.cli fix list | grep -i "Available autofixes" >/dev/null && echo "fix preview OK"

      # Everything above drives bulwark.cli — the bundled CLI, which shares a directory with
      # the GUI but not a line of its code. Those checks passed on a snap whose GUI could not
      # load WebKit at all. So: launch the real GUI on a runner with no WebKit of its own and
      # look at the pixels. The same script gates every pull request (ci.yml, snap-build), and
      # a failure here stops the upload below.
      - name: GUI launch test (the CLI smoke test cannot catch a broken GUI)
        run: scripts/test-snap-gui.sh

      # snapcraft reads the login from SNAPCRAFT_STORE_CREDENTIALS; no action needed for that.
      # This is the command snapcore/action-publish ran (`snapcraft upload <file> --release
      # <channel>`, with the same variable), and what snapcraft documents: `--release` takes
      # a comma-separated list of channels, and the command waits for the store's review.
      # It exits 1 while the store holds a classic snap for manual review, which is the state
      # today (packaging/README.md, "What the store says today").
      - name: Publish snap
        if: github.event_name == 'workflow_dispatch'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          SNAP: ${{ steps.build.outputs.snap }}
          CHANNEL: ${{ github.event.inputs.channel }}
        run: snapcraft upload "$SNAP" --release="$CHANNEL"
