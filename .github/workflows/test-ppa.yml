name: Test PPA package (live install)

# Installs bulwarkctl from the LIVE PPA exactly as a user would — add-apt-repository,
# apt install — inside a clean container of the target Ubuntu series, then smoke-tests
# the installed package. This validates the actual PUBLISHED artifact end-to-end
# (rule-pack resolution from /usr/share/bulwark, scan, fix), which the pre-publish
# install-verify in publish-ppa.yml can't: that tests a locally-built .deb, this tests
# what `apt install` actually delivers.
#
# Run it AFTER a series' build has published in the PPA (a freshly-uploaded series
# 403s on apt update until its first binary is published). Manual + weekly.
#
# It also checks WHICH version was installed. Launchpad builds each architecture on its own
# queue, so for hours after an upload one architecture can serve the new version while the
# other still serves the previous one, and a build that fails on one architecture leaves it
# there for good (Launchpad reports that by email only). An install test that accepts any
# version passes through all of that: it did, on 0.15.0, with arm64 on 0.15.0 and x86_64 on
# 0.13.0. So the installed package must be the newest source the PPA publishes for the series.
on:
  workflow_dispatch:
    inputs:
      series:
        description: "Ubuntu series to test (must be published in the PPA)"
        type: choice
        options: [all, noble, resolute, stonking]
        default: all
  # Called by publish-ppa.yml once every series it uploaded is built and published.
  workflow_call:
    inputs:
      series:
        type: string
        required: true
      expect_upstream:
        description: "Upstream version that must be installed (e.g. 0.15.0)"
        type: string
        default: ""
  schedule:
    - cron: "17 6 * * 1" # weekly, every series: catch a PPA that silently stops working

permissions:
  contents: read

# Only the owner may start jobs; triggering_actor also covers owner-initiated reruns.
jobs:
  install-from-ppa:
    if: github.triggering_actor == 'vietanhdev'
    # Both architectures, each on its own native runner. The PPA is dual-arch by virtue of
    # `Architecture: any` in debian/control — Launchpad builds every arch the series enables —
    # but that had never been *verified*: this workflow only ever installed the amd64 build, so
    # the arm64 half of a channel the download page advertises was an untested claim. It is
    # also the failure most likely to go unnoticed, because Launchpad reports per-arch build
    # results by email rather than failing anything here.
    runs-on: ${{ matrix.runner }}
    strategy:
      # A series that published one arch but not the other should say which one broke.
      fail-fast: false
      matrix:
        # One series when it is named; all of them for `all` and for the weekly run, which
        # has no inputs. Keep this list in step with publish-ppa.yml's default.
        series: ${{ fromJSON((inputs.series == '' || inputs.series == 'all') && '["noble","resolute","stonking"]' || format('["{0}"]', inputs.series)) }}
        arch: [x86_64, aarch64]
        include:
          - { arch: x86_64,  runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    name: install-from-ppa (${{ matrix.series }}, ${{ matrix.arch }})
    # Clean container of the target series (Ubuntu images carry codename tags, and are
    # multi-arch, so this resolves to the runner's architecture).
    container: ubuntu:${{ matrix.series }}
    steps:
      - name: Add the PPA and install bulwarkctl
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          # Guard against the container silently resolving to the wrong arch: apt would then
          # install a package that runs fine and prove nothing about the arch under test.
          test "$(uname -m)" = "${{ matrix.arch }}" || {
            echo "::error::expected ${{ matrix.arch }} but this runner is $(uname -m)"; exit 1; }
          apt-get update
          apt-get install -y --no-install-recommends software-properties-common ca-certificates
          # -s also enables the PPA's source index, which the version check below reads.
          add-apt-repository -y -s ppa:vietanhng/bulwark
          apt-get update
          # --no-install-recommends skips the optional clamav to keep the test lean;
          # bulwarkctl works fully without it.
          apt-get install -y --no-install-recommends bulwarkctl

      - name: The installed version is the one the PPA publishes
        env:
          SERIES: ${{ matrix.series }}
          ARCH: ${{ matrix.arch }}
          EXPECT_UPSTREAM: ${{ inputs.expect_upstream }}
        run: |
          set -eu
          installed=$(dpkg-query -W -f='${Version}' bulwarkctl)
          # The newest source the PPA publishes for this series, from apt's own (signed) index.
          published=""
          for v in $(apt-cache showsrc bulwark | awk '$1 == "Version:" {print $2}'); do
            if [ -z "$published" ] || dpkg --compare-versions "$v" gt "$published"; then published=$v; fi
          done
          echo "installed: $installed    published source: ${published:-none}"
          [ -n "$published" ] || { echo "::error::the PPA's source index lists no 'bulwark' for $SERIES"; exit 1; }
          if [ "$installed" != "$published" ]; then
            echo "::error::$SERIES $ARCH installs $installed, but the PPA publishes $published. This architecture's build is still queued, failed, or not published yet: https://launchpad.net/~vietanhng/+archive/ubuntu/bulwark/+packages"
            exit 1
          fi
          upstream=${installed%%-*}
          if [ -n "$EXPECT_UPSTREAM" ] && [ "$upstream" != "$EXPECT_UPSTREAM" ]; then
            echo "::error::expected $EXPECT_UPSTREAM, but $SERIES $ARCH installs $installed"; exit 1
          fi
          # The binary must report the version its package claims.
          reported=$(bulwarkctl --version)
          [ "$reported" = "bulwarkctl $upstream" ] || {
            echo "::error::package $installed contains a binary that reports '$reported'"; exit 1; }

      - name: Smoke-test the installed package
        run: |
          set -eux
          # Installed from the archive: binary on PATH, rules under /usr/share/bulwark.
          bulwarkctl --version
          test "$(bulwarkctl rules list | grep -c '^BLWK-')" -gt 0
          # scan exits non-zero when it finds issues (linter-style) — capture, then
          # assert it produced JSON that actually loaded rules.
          bulwarkctl scan --json > /tmp/scan.json || true
          test -s /tmp/scan.json
          grep -q '"rules_loaded"' /tmp/scan.json
          grep -q '"rules_loaded": *0' /tmp/scan.json && { echo "::error::scan loaded 0 rules"; exit 1; } || true
          bulwarkctl fix list | grep -i "Available autofixes" >/dev/null && echo "fix preview OK"
          echo "PPA package installs and runs on ${{ matrix.series }} (${{ matrix.arch }}) ✅"
