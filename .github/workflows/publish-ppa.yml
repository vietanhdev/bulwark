name: Publish PPA (CLI)

# Manual only — a Launchpad upload is IRREVERSIBLE (a version can be superseded,
# never deleted), so this never fires automatically. See packaging/README.md.
#
# One run does the whole job: picks the next free PPA revision, reuses the version's
# published .orig if Launchpad already has one (so a re-upload from any commit matches it),
# uploads every series, waits until Launchpad has accepted, built and published each one on
# every architecture the PPA enables, then installs it from the live PPA on both arches.
# Launchpad reports rejections and build failures only by email; the wait turns them into a
# red run here.
#
# Required repository secrets:
#   LAUNCHPAD_GPG_PRIVATE_KEY  — ASCII-armored private key registered on the
#                                Launchpad account that owns ppa:vietanhng/bulwark.
#                                Use a key DEDICATED to CI; a passphraseless key is
#                                simplest (dpkg-buildpackage signs non-interactively).
#   LAUNCHPAD_GPG_PASSPHRASE   — optional; only if the key above has a passphrase.
on:
  workflow_dispatch:
    inputs:
      # Upload every series of a version in ONE run. noble is deliberately absent — its
      # cargo 1.75 can't parse Cargo.lock v4.
      series:
        description: "Ubuntu series, space-separated"
        required: true
        default: "resolute stonking"
      ppa_rev:
        description: "PPA revision. auto = one above the highest already uploaded for this version"
        required: true
        default: "auto"
      dry_run:
        description: "Build + sign only; skip the (irreversible) dput upload"
        type: boolean
        default: false

permissions:
  contents: read

# Only the owner may start jobs; triggering_actor also covers owner-initiated reruns.
jobs:
  publish-ppa:
    if: github.triggering_actor == 'vietanhdev'
    runs-on: ubuntu-24.04
    # Launchpad builds the vendored Rust tree from scratch; arm64 can take well over an hour.
    timeout-minutes: 300
    outputs:
      series: ${{ steps.upload.outputs.series }}
    steps:
      - uses: actions/checkout@v7

      - name: Install packaging toolchain
        run: |
          # Prefer IPv4: runners have no IPv6 route, and dput's FTP to Launchpad has failed
          # with "Network is unreachable" when the resolver handed it an IPv6 address first.
          echo 'precedence ::ffff:0:0/96 100' | sudo tee -a /etc/gai.conf >/dev/null
          sudo apt-get update
          # build-essential: the binary-build install-test compiles the bundled
          # SQLite (libsqlite3-sys) which needs a C compiler; also satisfies
          # dpkg-buildpackage's implicit build-essential:native build-dep.
          sudo apt-get install -y --no-install-recommends \
            devscripts dput debhelper dpkg-dev build-essential cargo rustc python3

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.LAUNCHPAD_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.LAUNCHPAD_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::error::LAUNCHPAD_GPG_PRIVATE_KEY secret is not set" >&2
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"; chmod 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          # Non-interactive signing (validated method): loopback + a passphrase-file
          # in gpg.conf, so EVERY gpg call — including the ones dpkg-buildpackage makes,
          # which take no passphrase argument — reads the passphrase from the file.
          # (The agent-preset approach does NOT work here: pinentry-mode loopback makes
          # gpg bypass the agent, so a preset is never consulted and signing fails with
          # "Operation cancelled" on a headless runner.)
          umask 077
          printf '%s' "${GPG_PASSPHRASE:-}" > "$GNUPGHOME/passphrase"
          {
            echo "pinentry-mode loopback"
            echo "passphrase-file $GNUPGHOME/passphrase"
            echo "batch"
          } > "$GNUPGHOME/gpg.conf"
          printf 'allow-loopback-pinentry\n' > "$GNUPGHOME/gpg-agent.conf"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpgconf --kill gpg-agent || true
          gpgconf --launch gpg-agent || true
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/{print $5; exit}')
          echo "SIGN_KEY=$KEYID" >> "$GITHUB_ENV"
          # Prove signing is non-interactive before we build anything.
          echo "ci-signing-selftest" | gpg --local-user "$KEYID" --clearsign > /dev/null
          echo "GPG signing self-test passed (key $KEYID)"

      - name: Build and upload source package(s)
        id: upload
        env:
          SERIES: ${{ github.event.inputs.series }}
          PPA_REV: ${{ github.event.inputs.ppa_rev }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          DEBEMAIL: "vietanh.dev@gmail.com"
          DEBFULLNAME: "Viet Anh Nguyen"
        run: |
          set -euo pipefail
          UPSTREAM=$(python3 -c 'import re;print(re.search(r"\[workspace\.package\][^\[]*?version\s*=\s*\"([^\"]+)\"",open("Cargo.toml").read(),re.S).group(1))')
          [ "$PPA_REV" = "auto" ] && PPA_REV=$(scripts/ppa-launchpad.py next-rev --upstream "$UPSTREAM")
          echo "upstream $UPSTREAM, PPA revision $PPA_REV"
          echo "UPSTREAM=$UPSTREAM" >> "$GITHUB_ENV"
          echo "PPA_REV=$PPA_REV" >> "$GITHUB_ENV"
          echo "series=$(python3 -c 'import json,sys;print(json.dumps(sys.argv[1].split()))' "$SERIES")" >> "$GITHUB_OUTPUT"
          # A version has ONE .orig, shared by every series and revision. If Launchpad already
          # has it, build from those exact bytes (a tree rebuilt from this commit would differ
          # and be rejected). Otherwise the first series uploads a fresh one (-sa) and the rest
          # reference it (-sd).
          mkdir -p target/ppa
          ORIG=$(scripts/ppa-launchpad.py fetch-orig --upstream "$UPSTREAM" --out target/ppa)
          [ -n "$ORIG" ] && echo "reusing the published $ORIG"
          first=1
          for s in $SERIES; do
            src_flags=()
            if [ -n "$ORIG" ]; then src_flags=(--orig "$ORIG"); elif [ "$first" = "0" ]; then src_flags=(--sd); fi
            echo "::group::build $s ${src_flags[*]}"
            scripts/build-ppa-source.sh --series "$s" --ppa-rev "$PPA_REV" --sign-key "$SIGN_KEY" "${src_flags[@]}"
            echo "::endgroup::"
            first=0
            if [ "$DRY_RUN" = "true" ]; then
              echo "DRY RUN — skipping dput. Built + signed:"
              ls -1 "target/ppa/bulwark_"*"~${s}"*"_source.changes"
              # Prove the signature on the .changes is valid without uploading.
              gpg --verify "target/ppa/bulwark_"*"~${s}"*"_source.changes" 2>&1 | grep -i "good signature" || true
              # Install-test: the offline SOURCE build + signature are proven above
              # (that's the PPA-specific part Launchpad runs). Here we build the binary
              # .deb the project ships — via cargo-deb, the same tool release.yml uses,
              # producing the same binary + rule-pack layout Launchpad's build yields —
              # then install it and functionally smoke-test the installed package.
              # (cargo-deb avoids the dpkg-source/vendored-*.orig round-trip, which is
              # sensitive to the runner's cargo version.)
              echo "::group::binary .deb build + install test ($s)"
              cargo build --release -p bulwarkctl
              command -v cargo-deb >/dev/null || cargo install cargo-deb --locked
              cargo deb -p bulwarkctl --no-build
              sudo apt-get install -y ./target/debian/bulwarkctl_*.deb
              bulwarkctl --version
              m=$(bulwarkctl rules list | grep -c '^BLWK-' || true)
              echo "rules: $m"; test "$m" -gt 0
              # `scan` exits non-zero when it finds issues (linter-style), so capture
              # to a file and validate the JSON separately from the exit code.
              bulwarkctl scan --json > "$RUNNER_TEMP/scan.json" || true
              python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));assert d["rules_loaded"]>0,d;print("scan OK: rules_loaded",d["rules_loaded"],"findings",len(d.get("findings",[])))' "$RUNNER_TEMP/scan.json"
              bulwarkctl fix list | grep -i "Available autofixes" >/dev/null && echo "fix preview OK"
              echo "::endgroup::"
              continue
            fi
            echo "::group::dput $s"
            # `ppa:` shortcut is understood by modern dput; upload is irreversible. Retried:
            # Launchpad's FTP endpoint is intermittently unreachable from GitHub's runners. A
            # failing attempt hangs ~7 minutes before "Network is unreachable", while a good
            # one takes seconds, so each attempt is capped. dput only records a completed
            # upload, so a retry after a timeout is safe.
            changes=$(ls target/ppa/bulwark_*"-0ppa${PPA_REV}~${s}1_source.changes")
            for attempt in 1 2 3 4 5 6 7 8; do
              timeout 120 dput ppa:vietanhng/bulwark "$changes" && break
              [ "$attempt" = 8 ] && { echo "::error::dput failed 8 times for $s"; exit 1; }
              echo "dput failed (attempt $attempt), retrying in 20s"
              sleep 20
            done
            echo "::endgroup::"
          done

      - name: Wait for Launchpad to accept, build and publish every series
        if: github.event.inputs.dry_run != 'true'
        env:
          SERIES: ${{ github.event.inputs.series }}
        run: scripts/ppa-launchpad.py wait --upstream "$UPSTREAM" --rev "$PPA_REV" --series "$SERIES" --timeout-min 270

  # Install what users get: the published package, from the live PPA, on both architectures.
  install-test:
    needs: publish-ppa
    if: github.triggering_actor == 'vietanhdev' && github.event.inputs.dry_run != 'true'
    strategy:
      fail-fast: false
      matrix:
        series: ${{ fromJSON(needs.publish-ppa.outputs.series) }}
    uses: ./.github/workflows/test-ppa.yml
    with:
      series: ${{ matrix.series }}
