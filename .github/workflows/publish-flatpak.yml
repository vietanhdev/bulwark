name: Publish Flatpak (GUI)

# Manual only. Builds the GUI Flatpak offline and produces a single-file
# `bulwark.flatpak` bundle, uploaded as a workflow artifact and (optionally)
# attached to a GitHub release. Flathub proper is a SEPARATE submission (a PR to
# flathub/flathub); this workflow does not push to Flathub.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "If set, attach the bundle to this existing release tag (e.g. v0.7.0). Leave blank to only produce a workflow artifact."
        required: false
        default: ""

permissions:
  contents: write   # only used when release_tag is set, to upload the asset

# Only the owner may start jobs; triggering_actor also covers owner-initiated reruns.
jobs:
  publish-flatpak:
    if: github.triggering_actor == 'vietanhdev'
    runs-on: ubuntu-24.04
    steps:
      # Shallow checkout: the manifest's `type: dir` copies the repo into the
      # sandbox, so keep .git small. A fresh checkout has no target/ or
      # node_modules, so nothing heavy is copied.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # packaging/flatpak/shared-modules is a submodule carrying the libappindicator
          # build chain; without this the manifest references a file that isn't there.
          submodules: true
          # This job holds a token that can write releases, and it runs a generator cloned
          # from another repository plus pip and npm packages. Nothing here pushes with git,
          # so the token is not left in the checkout for them to find; the attach step at the
          # end is handed it directly.
          persist-credentials: false

      # Before the build, not after it. The bundle is built from THIS checkout, whatever
      # release_tag says, so a run started from a branch that has moved on would attach a
      # bundle of a different version to that release. And a tag with no release behind it
      # should fail here, not after the build.
      - name: Check the release tag matches this checkout
        if: ${{ github.event.inputs.release_tag != '' }}
        env:
          TAG: ${{ github.event.inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::this checkout builds ${version}, but release_tag is ${TAG}. Start the run from the tag (or from a commit at that version)."
            exit 1
          fi
          # Finds a draft as well as a published release; fails if there is neither.
          gh release view "${TAG}" --json tagName,isDraft \
            --jq '"release \(.tagName) exists (draft: \(.isDraft))"'
          # An annotated tag lists twice, and the peeled commit (^{}) sorts last.
          tagged="$(git ls-remote origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}" | sort -k2 | tail -n1 | cut -f1 || true)"
          if [ "${tagged}" != "$(git rev-parse HEAD)" ]; then
            echo "::warning::this checkout ($(git rev-parse --short HEAD)) is not the commit ${TAG} points at (${tagged:0:7}); the bundle is built from this checkout."
          fi

      - name: Install flatpak + builder + generator deps
        run: |
          set -euo pipefail
          sudo apt-get update
          # elfutils provides eu-strip/eu-elfcompress, which flatpak-builder uses
          # to split debuginfo into the .Debug extension (absent on stock runners).
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder python3 python3-venv python3-pip git xz-utils elfutils
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install runtime + SDK + extensions (matches the manifest)
        run: |
          set -euo pipefail
          flatpak install -y --user --noninteractive flathub \
            org.gnome.Platform//50 \
            org.gnome.Sdk//50 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08 \
            org.freedesktop.Sdk.Extension.node20//25.08

      - name: Generate offline cargo/node sources
        run: scripts/flatpak-gen-sources.sh

      - name: Build Flatpak + bundle
        run: |
          set -euo pipefail
          # Build/state/repo OUTSIDE the repo tree so the `type: dir` source copy
          # can never recurse into its own build dir.
          flatpak-builder \
            --user --force-clean --disable-rofiles-fuse \
            --repo="$RUNNER_TEMP/fp-repo" \
            --state-dir="$RUNNER_TEMP/fp-state" \
            "$RUNNER_TEMP/fp-build" \
            packaging/flatpak/com.vietanhdev.bulwark.yaml
          flatpak build-bundle "$RUNNER_TEMP/fp-repo" \
            bulwark.flatpak com.vietanhdev.bulwark master

      - name: Install bundle + smoke-test
        run: |
          set -euo pipefail
          flatpak install -y --user bulwark.flatpak
          flatpak info com.vietanhdev.bulwark | grep -E "ID:|Version:"
          # The bundled CLI sidecar must resolve the rule pack from inside the
          # sandbox (proves install layout + next-to-exe rule resolution).
          flatpak run --command=bulwark com.vietanhdev.bulwark --version
          n=$(flatpak run --command=bulwark com.vietanhdev.bulwark rules list | grep -c '^BLWK-' || true)
          echo "rules visible in sandbox: $n"
          test "$n" -gt 0
          # Functional: real scan produces valid JSON with rules loaded; fix previews.
          # `scan` exits non-zero when it finds issues (linter-style), so capture
          # to a file and validate the JSON separately from the exit code.
          flatpak run --command=bulwark com.vietanhdev.bulwark scan --json > "$RUNNER_TEMP/scan.json" || true
          python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));assert d["rules_loaded"]>0,d;print("scan OK: rules_loaded",d["rules_loaded"],"findings",len(d.get("findings",[])))' "$RUNNER_TEMP/scan.json"
          flatpak run --command=bulwark com.vietanhdev.bulwark fix list | grep -i "Available autofixes" >/dev/null && echo "fix preview OK"

      # Every assertion above passed on a build whose GUI crashed on launch: they all
      # drive `--command=bulwark`, the CLI sidecar, which shares a directory with the GUI
      # but not its code. The shipped app died in a libayatana-appindicator dlopen panic
      # (absent from the GNOME runtime) and, before that, logged "couldn't find a 'rules'
      # directory" because the GUI has its own resolver that only checked resource_dir().
      # So: launch the actual GUI binary under Xvfb and fail on any panic.
      - name: GUI launch test (the CLI smoke test cannot catch a GUI crash)
        run: |
          set -uo pipefail
          # A tool that failed to install must stop the test: every check below that needs
          # it would otherwise be skipped or read as a failure of the app.
          sudo apt-get install -y -qq xvfb imagemagick x11-apps dbus >/dev/null \
            || { echo "FAIL: could not install the test tools"; exit 1; }
          for t in Xvfb import identify dbus-daemon; do
            command -v "$t" >/dev/null || { echo "FAIL: test tool $t is missing"; exit 1; }
          done
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          sleep 3
          # A session bus, as every desktop has. Without one the app starts anyway and skips
          # single-instance, so this test could never notice a sandbox that refuses the app
          # its bus name: it passed for months while the manifest granted a name the app had
          # stopped asking for.
          BUS="$(dbus-daemon --session --fork --print-address=1 --print-pid=1)"
          DBUS_SESSION_BUS_ADDRESS="$(printf '%s\n' "$BUS" | sed -n 1p)"
          BUS_PID="$(printf '%s\n' "$BUS" | sed -n 2p)"
          export DBUS_SESSION_BUS_ADDRESS
          [ -n "$DBUS_SESSION_BUS_ADDRESS" ] || { echo "FAIL: could not start a session bus"; exit 1; }
          # No --socket overrides: run it exactly as a user would, so a missing runtime
          # library or a wrong permission fails here rather than on someone's desktop.
          timeout 120 flatpak run com.vietanhdev.bulwark >"$RUNNER_TEMP/gui.log" 2>&1 &
          APP_PID=$!
          sleep 25
          echo "----- GUI output -----"; cat "$RUNNER_TEMP/gui.log"; echo "----------------------"
          fail=0
          grep -qi "panicked" "$RUNNER_TEMP/gui.log" && { echo "FAIL: GUI panicked on launch"; fail=1; }
          grep -q "couldn.t find a .rules. directory" "$RUNNER_TEMP/gui.log" && {
            echo "FAIL: rules not resolved — continuous monitoring would be silently disabled"; fail=1; }
          grep -q "rules directory resolved" "$RUNNER_TEMP/gui.log" || {
            echo "FAIL: GUI never logged a resolved rules directory"; fail=1; }
          kill -0 $APP_PID 2>/dev/null || { echo "FAIL: GUI process died"; fail=1; }

          # The frontend must come from the embedded assets. An http(s) URL means the build
          # lacked --features custom-protocol, so Tauri served devUrl and the window is empty
          # on any machine with nothing on that port. The Flatpak shipped exactly that, and
          # every check above passed the whole time.
          grep -qE "webview url: https?://" "$RUNNER_TEMP/gui.log" && {
            echo "FAIL: DEV build — UI loaded over http instead of the embedded frontend"; fail=1; }
          grep -q "webview url: tauri://" "$RUNNER_TEMP/gui.log" || {
            echo "FAIL: webview never loaded the embedded frontend"; fail=1; }

          # And prove it actually painted. Every assertion above is true of an app rendering
          # a blank window; only the pixels disprove that. A rendered UI scores hundreds of
          # distinct colours, an empty one a handful.
          import -window root "$RUNNER_TEMP/shot.png" 2>/dev/null || true
          if [ -s "$RUNNER_TEMP/shot.png" ]; then
            colors=$(identify -format "%k" "$RUNNER_TEMP/shot.png" 2>/dev/null || echo 0)
            echo "distinct colours on screen: ${colors}"
            [ "${colors:-0}" -lt 50 ] && { echo "FAIL: window is blank (${colors} colours)"; fail=1; }
          else
            # Not a warning: without the picture this is the test that passed on a blank window.
            echo "FAIL: no screenshot could be captured, so rendering was not verified"; fail=1
          fi

          # Starting it again must hand over to the running app and exit, not open a second
          # one. This is the only check that proves the sandbox lets the app own its
          # single-instance bus name (<app-id>.SingleInstance), which the manifest no longer
          # declares because Flatpak grants an app the names under its own id.
          if kill -0 $APP_PID 2>/dev/null; then
            timeout 20 flatpak run com.vietanhdev.bulwark >"$RUNNER_TEMP/second.log" 2>&1
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "second launch handed over to the first and exited"
            else
              echo "FAIL: a second launch did not hand over to the running app (exit $rc)"
              sed 's/^/  second: /' "$RUNNER_TEMP/second.log" | head -20
              fail=1
            fi
            kill -0 $APP_PID 2>/dev/null || { echo "FAIL: the first app died when a second was started"; fail=1; }
          fi

          kill $APP_PID 2>/dev/null || true
          kill "$BUS_PID" 2>/dev/null || true
          [ $fail -eq 0 ] && echo "GUI launch OK"
          exit $fail

      - name: Upload bundle as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: bulwark-flatpak
          path: bulwark.flatpak
          if-no-files-found: error

      # `gh release upload`, not softprops/action-gh-release. That action, run without
      # `draft: true`, takes the release OUT of draft once the upload is done (its own
      # description: "omit it to publish after upload"), and creates a release when the tag
      # has none. release.yml leaves every release as a draft to be looked at first, so
      # attaching the Flatpak before publishing would have published it. `gh release upload`
      # only adds assets: it works on a draft or a published release, changes neither, and
      # fails if the release does not exist.
      #
      # The bundle's checksum goes into the release's SHA256SUMS as well. That file is
      # written by release.yml before this bundle exists, so without this step the Flatpak is
      # the one asset `sha256sum -c SHA256SUMS` cannot verify.
      - name: Attach bundle to release
        if: ${{ github.event.inputs.release_tag != '' }}
        env:
          TAG: ${{ github.event.inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/release-sums"
          rm -rf "$work"; mkdir -p "$work"
          if ! gh release download "$TAG" --pattern SHA256SUMS --dir "$work" 2>"$work/err"; then
            # A release with no SHA256SUMS yet is fine; any other failure is not.
            grep -q "no assets match" "$work/err" || { cat "$work/err" >&2; exit 1; }
            : > "$work/SHA256SUMS"
          fi
          # Replace an earlier line for the bundle (a second run for the same release).
          { grep -v '  bulwark\.flatpak$' "$work/SHA256SUMS" || true; sha256sum bulwark.flatpak; } > "$work/new"
          mv "$work/new" "$work/SHA256SUMS"
          cat "$work/SHA256SUMS"
          gh release upload "$TAG" bulwark.flatpak "$work/SHA256SUMS" --clobber
