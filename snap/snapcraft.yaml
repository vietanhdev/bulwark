name: bulwark
title: Bulwark
# core22, not the newest base, for the same reason release.yml builds in ubuntu:22.04: the build
# image's glibc is the oldest glibc the app runs on. A classic snap runs against the HOST's libc
# (see "what the snap carries" below), so a core24 build would not start on Ubuntu 22.04.
base: core22
version: '0.15.0'   # set by scripts/bump-version.sh (checked by scripts/check-packaging-consistency.sh)
summary: Linux security misconfiguration & intrusion scanner (GUI)
description: |
  Bulwark scans a Linux host for security misconfigurations and intrusion
  indicators using a native Rust rule engine over declarative YAML rules, and
  explains findings in plain language with a suggested fix.

  This is the desktop GUI. Privileged scans elevate via pkexec/polkit and read
  system files under /etc, so this snap uses CLASSIC confinement — a strict
  sandbox would prevent it from auditing the host it is installed on. Classic
  confinement requires manual review and approval by the Snap Store team before
  it can be published; see packaging/README.md.

license: Apache-2.0
grade: stable
confinement: classic     # NOT strict: pkexec + host /etc access are load-bearing (see README)

# Declared, not incidental. Without this key snapcraft builds for the host arch only, so the
# snap was amd64-only purely because publish-snap.yml happens to say `runs-on: ubuntu-24.04` —
# an architecture decision recorded nowhere, enforced by nothing, and silently reversible by an
# unrelated edit to a workflow. Stating it makes the restriction reviewable, and gives
# scripts/check-packaging-consistency.sh something to assert against. (core22 spells this
# `architectures`; core24 calls it `platforms`. The check reads either.)
#
# amd64 only, deliberately: this snap needs `confinement: classic`, which requires manual Snap
# Store approval that has not been granted (and, per packaging/README.md, is unlikely to be —
# the criteria name /etc, sudo and pkexec in the not-supported list). Adding arm64 would
# multiply the build matrix for a channel that publishes nothing today. The build itself is
# arch-clean — the Node tarball below follows the target arch — so adding an arm64 entry here
# is a small change if the channel ever opens.
architectures:
  - build-on: [amd64]
    build-for: [amd64]

# No `plugs:` or `slots:`, on purpose. The Snap Store refuses them on a classic snap
# ("confinement 'classic' not allowed with plugs/slots"), and a classic snap does not need
# them: it is unconfined, so the app claims its single-instance bus name
# (<identifier>.SingleInstance) like any other program on the session bus. An earlier recipe
# declared a dbus slot and plug "in case it ever moves to strict"; that alone got every upload
# rejected. scripts/test-snap-gui.sh starts the app twice on a session bus to prove a second
# launch hands over to the first, and check-packaging-consistency.sh fails if they come back.

# What the snap carries: the same self-contained application folder the AppImage is made of,
# under app/, started through its own launcher (app/AppRun).
#
# An earlier recipe installed the two binaries by hand and listed WebKitGTK under
# stage-packages. That snap built, installed, passed every CLI check and could not start its
# GUI: "libwebkit2gtk-4.1.so.0: cannot open shared object file". A classic snap gets no library
# path from snapd, and nothing pointed the binary at $SNAP/usr/lib. Fixing only that is not
# enough either: WebKit starts its helper processes from a path compiled into the library
# (/usr/lib/<triplet>/webkit2gtk-4.1), and a classic snap runs in the host's mount namespace, so
# there is no `layout:` to redirect it (layouts are a strict-confinement feature). GTK's pixbuf
# loaders, GIO modules, input methods and GSettings schemas have the same problem.
#
# Tauri's AppImage bundler already solves all of that: it rewrites WebKit's helper path to a
# relative one, and its launcher sets the library path and the GTK variables and changes into
# the bundle before starting the app. release.yml launch-tests that folder on every release.
# So this recipe builds that bundle and unpacks it, and adds nothing of its own to the runtime.
#
# Two consequences, the same as for the AppImage:
#   - It expects the host's graphics stack (libEGL, Mesa) and two text-shaping libraries every
#     desktop has (libfribidi, libharfbuzz). WebKit and GTK come from the snap.
#   - The launcher's variables point into the bundle. bulwark_core::sandbox::host_env strips
#     them from every system program the app starts, keyed on APPDIR, which the launcher sets.
#
# The two linters below are switched off because their warnings describe this design, a few
# hundred lines of them per build. `classic` wants every ELF file pointed at the base snap's
# loader and libc; this bundle runs against the host's libc on purpose, because it uses the
# host's graphics libraries and those are built against the host's libc, not core22's.
# `library` lists exactly those host libraries as missing.
lint:
  ignore:
    - classic
    - library

apps:
  bulwark:
    command: app/AppRun
    desktop: usr/share/applications/bulwark.desktop
  # The bundled CLI, exposed as `bulwark.cli`: usable directly, and what the GUI's privileged
  # scan runs (resolve_cli_binary pins the `bulwark` binary beside the GUI binary). It carries
  # its rule pack built in and links only libc, so it needs no launcher.
  cli:
    command: app/usr/bin/bulwark

parts:
  # ---------------------------------------------------------------------------
  # Unlike the Launchpad PPA, snapcraft build environments HAVE network access, so
  # npm and cargo fetch normally — no vendoring needed here.
  # ---------------------------------------------------------------------------
  bulwark-app:
    plugin: nil
    source: .
    # The same list release.yml installs into its ubuntu:22.04 build image.
    build-packages:
      - ca-certificates
      - curl
      - file
      - git
      - build-essential
      - pkg-config
      - xz-utils
      - libssl-dev
      - libwebkit2gtk-4.1-dev
      - libgtk-3-dev
      - libayatana-appindicator3-dev
      - librsvg2-dev
      # The AppImage bundler needs both: patchelf to set library paths, and xdg-open, which it
      # copies into the bundle (the app opens links and folders through it).
      - patchelf
      - xdg-utils
      # NOTE: no nodejs/npm here — the base's Node is too old for the vite frontend
      # build (needs >=20.12). override-build fetches Node 22 instead.
    override-build: |
      set -eux
      # The archive's rustc is too old for the workspace; pin a current toolchain via
      # rustup for the build.
      export RUSTUP_HOME="$CRAFT_PART_BUILD/.rustup"
      export CARGO_HOME="$CRAFT_PART_BUILD/.cargo"
      curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
      export PATH="$CARGO_HOME/bin:$PATH"

      # The frontend build (vite/rolldown) needs Node >=20.12 (it imports styleText
      # from node:util). Fetch an official Node 22 build.
      #
      # The Node tarball is the ONE prebuilt binary this build downloads, so it is the one
      # place that can silently hardcode an architecture — rustup's installer detects the host
      # on its own. It used to fetch -linux-x64 unconditionally, which was invisible while the
      # only builder was amd64 and would have failed with a bare "cannot execute binary file"
      # the moment anyone built on arm. Derive it from the arch snapcraft is building FOR.
      NODE_VER=22.12.0
      case "${CRAFT_ARCH_BUILD_FOR:-$(dpkg --print-architecture)}" in
        amd64)  NODE_ARCH=x64 ;;
        arm64)  NODE_ARCH=arm64 ;;
        armhf)  NODE_ARCH=armv7l ;;
        *) echo "unsupported build arch: ${CRAFT_ARCH_BUILD_FOR:-unknown}" >&2; exit 1 ;;
      esac
      curl -fsSL "https://nodejs.org/dist/v${NODE_VER}/node-v${NODE_VER}-linux-${NODE_ARCH}.tar.xz" \
        | tar -xJ -C "$CRAFT_PART_BUILD"
      export PATH="$CRAFT_PART_BUILD/node-v${NODE_VER}-linux-${NODE_ARCH}/bin:$PATH"
      node --version

      # The CLI first: src-tauri/build.rs stages it as the GUI's `bulwark` sidecar, and a GUI
      # built before it exists ships a zero-byte placeholder.
      cd "$CRAFT_PART_SRC"
      cargo build --release -p bulwarkctl

      # `tauri build`, not a bare cargo build of the app crate: it builds the frontend, enables
      # the custom-protocol feature (without it the app loads devUrl and draws an empty
      # window), and bundles the rule pack and the sidecar where the app looks for them.
      #
      # The bundler's own tooling (linuxdeploy) is itself an AppImage, and an AppImage mounts
      # itself with FUSE, which a build container does not have. This tells it to unpack and
      # run instead. It affects only the build tooling.
      cd "$CRAFT_PART_SRC/apps/bulwark-app"
      npm ci
      APPIMAGE_EXTRACT_AND_RUN=1 npx tauri build --bundles appimage

      # --- install layout --------------------------------------------------
      # Unpack the bundle (no FUSE needed) into app/.
      APPIMAGE="$(ls "$CRAFT_PART_SRC"/target/release/bundle/appimage/*.AppImage)"
      chmod +x "$APPIMAGE"
      cd "$CRAFT_PART_BUILD"
      rm -rf squashfs-root
      "$APPIMAGE" --appimage-extract >/dev/null
      test -x squashfs-root/AppRun
      test -x squashfs-root/usr/bin/bulwark-app
      test -s squashfs-root/usr/bin/bulwark
      mkdir -p "$CRAFT_PART_INSTALL/app"
      cp -a squashfs-root/. "$CRAFT_PART_INSTALL/app/"
      # The extracted folders are mode 0700. Inside a mounted AppImage that is fine, the user
      # owns the mount; inside a snap the files belong to root, and nobody else could even
      # list them.
      chmod -R u+rwX,go+rX,go-w "$CRAFT_PART_INSTALL/app"

      # Desktop entry + icon. Every hicolor size is shipped rather than only 128:
      # GNOME asks for 48px constantly (dash, alt-tab, window list) and a 48
      # downscaled from 128 is visibly softer than one authored at 48.
      for s in 16 24 32 48 64 128 256 512; do
        install -D -m0644 "$CRAFT_PART_SRC/apps/bulwark-app/src-tauri/icons/${s}x${s}.png" \
          "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/${s}x${s}/apps/bulwark.png"
      done
      # The heredoc body is indented to stay inside this YAML block scalar, so the
      # leading spaces are stripped before writing: a .desktop line that starts
      # with whitespace is an error to desktop-file-validate (GLib tolerates it,
      # so it was invisible until something validated the file).
      #
      # Icon is a path under ${SNAP}, not a theme name: a snap's own icon folders are not on
      # the host's icon search path, so `Icon=bulwark` resolves to nothing there.
      sed 's/^ *//' <<'DESKTOP' | install -D -m0644 /dev/stdin \
        "$CRAFT_PART_INSTALL/usr/share/applications/bulwark.desktop"
      [Desktop Entry]
      Name=Bulwark
      Comment=Security for your dev machines, the servers they reach, and your AI coding tools
      Exec=bulwark
      Icon=${SNAP}/usr/share/icons/hicolor/256x256/apps/bulwark.png
      Terminal=false
      Type=Application
      Categories=System;Security;
      # The GTK/Wayland app_id the window advertises is the binary name
      # (measured with WAYLAND_DEBUG=1: xdg_toplevel.set_app_id("bulwark-app")),
      # not this file's basename. GNOME matches window -> desktop entry on that
      # string; without this line the window gets a generic icon.
      StartupWMClass=bulwark-app
      DESKTOP

# NOTE on polkit: the standalone .deb/.rpm install polkit/com.bulwark.policy so
# pkexec uses auth_admin (one prompt per scan). A classic snap cannot drop a file
# into /usr/share/polkit-1/actions on the host, so a snap install falls back to
# the distro default polkit action for pkexec. Document this for snap users, or
# ship install-polkit.sh alongside — same opt-in caveat as the .deb today.
